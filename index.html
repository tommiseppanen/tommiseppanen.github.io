<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Homepage</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Subtle background grid pattern */
    .bg-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center items-center selection:bg-indigo-500 selection:text-white bg-grid relative overflow-x-hidden p-6">

  <!-- Subtle glow background effects -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[350px] bg-gradient-to-tr from-indigo-600/20 via-sky-500/20 to-teal-400/10 blur-[130px] rounded-full"></div>
    <div class="absolute bottom-10 right-10 w-72 h-72 bg-indigo-500/10 blur-[100px] rounded-full"></div>
  </div>

  <main class="w-full max-w-2xl mx-auto flex flex-col justify-center">
    <section class="text-center space-y-4 mb-10">
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">
        Welcome to my homepage
      </h1>
      <p class="text-base sm:text-lg text-slate-400 max-w-md mx-auto leading-relaxed">
        Explore my projects below.
      </p>
    </section>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      
      <!-- Card 1: Portfolio Link -->
      <a href="https://tommiseppanen.github.io/portfolio" 
         class="group relative flex flex-col justify-between p-6 rounded-2xl border border-slate-800 bg-slate-900/70 hover:bg-slate-900/90 hover:border-indigo-500/50 backdrop-blur-md transition-all duration-300 transform hover:-translate-y-1 shadow-lg hover:shadow-indigo-500/10">
        <div>
          <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
            <!-- Material Symbols: folder -->
            <span class="material-symbols-outlined text-[20px] select-none">folder</span>
          </div>
          <h2 class="text-lg font-semibold text-white group-hover:text-indigo-300 transition-colors flex items-center gap-2">
            Portfolio
            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </h2>
          <p class="mt-2 text-sm text-slate-400 leading-normal">
            Take a look at my hobby projects.
          </p>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center text-xs font-medium text-slate-400 group-hover:text-indigo-400 transition-colors">
          <span>View portfolio</span>
          <span class="ml-1">→</span>
        </div>
      </a>

      <!-- Card 2: Rally Game Link -->
      <a href="https://tommiseppanen.github.io/rally/" 
         class="group relative flex flex-col justify-between p-6 rounded-2xl border border-slate-800 bg-slate-900/70 hover:bg-slate-900/90 hover:border-amber-500/50 backdrop-blur-md transition-all duration-300 transform hover:-translate-y-1 shadow-lg hover:shadow-amber-500/10">
        <div>
          <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
            <!-- Material Symbols: sports_score (checkered flag) -->
            <span class="material-symbols-outlined text-[20px] select-none">sports_score</span>
          </div>
          <h2 class="text-lg font-semibold text-white group-hover:text-amber-300 transition-colors flex items-center gap-2">
            Rally slide game
            <svg class="w-4 h-4 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </h2>
          <p class="mt-2 text-sm text-slate-400 leading-normal">
            Check out my Android game
          </p>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center text-xs font-medium text-slate-400 group-hover:text-amber-400 transition-colors">
          <span>Check out Rally Slide</span>
          <span class="ml-1">→</span>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
